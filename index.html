<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BootBox</title>

<style>
:root {
    color-scheme: dark;
    font-family: "Segoe UI", sans-serif;
    background: #0b0d12;
    color: #f5f7fb;
}

* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background:
        radial-gradient(ellipse at top left, #192338 0, transparent 45%),
        #0b0d12;
}

header {
    min-height: 68px;
    display: flex;
    align-items: center;
    padding: 0 30px;
    border-bottom: 1px solid #303746;
    background: #131720;
}

.logo {
    font-size: 27px;
    font-weight: 700;
    letter-spacing: .4px;
}

.logo span {
    color: #70a7ff;
}

main {
    width: 100%;
    max-width: 2000px;
    margin: 0 auto;
    padding: 28px;
    flex: 1;
    display: grid;
    grid-template-columns: minmax(340px, 440px) minmax(0, 1fr);
    gap: 24px;
    align-items: start;
}

.panel {
    min-width: 0;
    padding: 28px;
    border: 1px solid #303746;
    border-radius: 16px;
    background: #171b25;
    box-shadow: 0 16px 45px rgba(0, 0, 0, .22);
}

h1 {
    margin: 0 0 12px;
    font-size: 30px;
    line-height: 1.3;
}

h2 {
    margin: 30px 0 14px;
    font-size: 19px;
}

.description {
    margin: 0;
    color: #b5bfd0;
    font-size: 15px;
    line-height: 1.8;
}

.file-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
}

button,
.file-button {
    min-height: 52px;
    padding: 0 20px;
    border: 1px solid #465166;
    border-radius: 10px;
    background: #272e3b;
    color: #fff;
    font-size: 15px;
    font-weight: 650;
    cursor: pointer;
    transition: background .16s ease, border-color .16s ease;
}

button:hover,
.file-button:hover {
    background: #353f50;
    border-color: #6d8fc5;
}

button.primary {
    background: #1769d2;
    border-color: #1769d2;
}

button.primary:hover {
    background: #287de8;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

input[type="file"] {
    display: none;
}

select {
    width: 100%;
    min-height: 50px;
    padding: 0 14px;
    border: 1px solid #465166;
    border-radius: 9px;
    background: #10141c;
    color: #fff;
    font-size: 15px;
}

.field {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.field label {
    color: #c3cddd;
    font-size: 14px;
}

#isoName,
#hddName {
    width: 100%;
    color: #aeb9cb;
    font-size: 13px;
    overflow-wrap: anywhere;
}

#status {
    margin-top: 22px;
    padding: 16px;
    border: 1px solid #303746;
    border-radius: 10px;
    background: #10141c;
    color: #c3cddd;
    font-size: 14px;
    line-height: 1.8;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.notice {
    margin-top: 20px;
    padding: 16px;
    border: 1px solid #69572b;
    border-radius: 10px;
    background: #302817;
    color: #f3dca2;
    font-size: 13px;
    line-height: 1.8;
}

#vmPanel {
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.vm-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.vm-toolbar h1 {
    margin: 0;
}

#screenFrame {
    width: 100%;
    min-height: 650px;
    background: #000;
    border: 1px solid #343943;
    border-radius: 12px;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
}

#screen {
    width: 100%;
    min-height: 650px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
}

#screen canvas {
    display: block;
    max-width: 100%;
    height: auto;
    image-rendering: pixelated;
}

#screen > div[style*="white-space"] {
    font-family: monospace !important;
}

.placeholder {
    max-width: 520px;
    padding: 48px 24px;
    color: #8e9bb0;
    font-size: 16px;
    line-height: 2;
    text-align: center;
}

#fullscreenButton {
    min-height: 44px;
}

#sidebarToggle {
    display: none;
}

footer {
    padding: 20px;
    color: #788393;
    text-align: center;
    font-size: 13px;
}

@media (min-width: 1500px) {
    main {
        grid-template-columns: 440px minmax(0, 1fr);
        padding: 36px;
        gap: 28px;
    }

    #screenFrame,
    #screen {
        min-height: 780px;
    }
}

@media (max-width: 1050px) {
    main {
        grid-template-columns: 1fr;
        padding: 18px;
    }

    #screenFrame,
    #screen {
        min-height: 480px;
    }
}

@media (max-width: 600px) {
    header {
        padding: 0 18px;
    }

    main {
        padding: 12px;
        gap: 14px;
    }

    .panel {
        padding: 18px;
    }

    h1 {
        font-size: 25px;
    }

    .file-row button,
    .file-button {
        width: 100%;
    }

    #screenFrame,
    #screen {
        min-height: 300px;
    }
}

/* 全画面表示 */
body.fullscreen-mode main {
    max-width: none;
    padding: 8px;
    display: block;
}

body.fullscreen-mode #setupPanel {
    display: none;
}

body.fullscreen-mode #vmPanel {
    width: 100%;
    height: calc(100vh - 90px);
}

body.fullscreen-mode #screenFrame {
    min-height: 0;
    height: 100%;
    flex: 1;
}

body.fullscreen-mode #screen {
    min-height: 0;
    height: 100%;
}

body.fullscreen-mode #screen canvas {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

/* 設定サイドバーの開閉 */
body.sidebar-collapsed main {
    grid-template-columns: 76px minmax(0, 1fr);
}

body.sidebar-collapsed #setupPanel .setupContent {
    display: none;
}

body.sidebar-collapsed #setupPanel {
    padding: 14px;
}

body.sidebar-collapsed #setupPanel h1 {
    font-size: 0;
}

body.sidebar-collapsed #setupPanel h1::after {
    content: "⚙";
    font-size: 28px;
}

@media (max-width: 1050px) {
    body.sidebar-collapsed main {
        grid-template-columns: 76px minmax(0, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Boot<span>Box</span></div>
</header>

<main>

    <section class="panel" id="setupPanel">
        <h1>仮想PCの設定</h1>

        <div class="setupContent">
            <p class="description">
                ISOファイルを読み込み、ブラウザ上で仮想PCを起動します。
            </p>

            <h2>OSイメージ</h2>

            <div class="file-row">
                <label class="file-button" for="isoFile">
                    ISOファイルを選択
                </label>
                <input type="file" id="isoFile" accept=".iso">
                <span id="isoName">ISO未選択</span>
            </div>

            <h2>仮想HDD</h2>

            <div class="file-row">
                <label class="file-button" for="hddFile">
                    HDDイメージを開く
                </label>
                <input
                    type="file"
                    id="hddFile"
                    accept=".img,.hdd,.bin,.raw"
                >
                <span id="hddName">HDD未選択</span>
            </div>

            <div class="file-row">
                <div class="field">
                    <label for="hddSize">新規HDD容量</label>
                    <select id="hddSize">
                        <option value="64">64 MB</option>
                        <option value="128">128 MB</option>
                        <option value="256">256 MB</option>
                        <option value="512">512 MB</option>
                        <option value="1024">1 GB</option>
                        <option value="2048">2 GB</option>
                        <option value="4096">4 GB</option>
                        <option value="8192">8 GB</option>
                        <option value="16384" selected>16 GB</option>
                        <option value="32768">32 GB</option>
                        <option value="65536">64 GB</option>
                    </select>
                </div>
            </div>

            <div class="notice">
                <strong>HDDについて</strong><br>
                既存のHDDイメージを指定すると、その内容を仮想HDDとして使用します。
                新規HDDは選択容量に相当するメモリ領域を確保します。
                大容量ではメモリ不足になる場合があります。
                HDDの変更内容は自動保存されません。
            </div>

            <div class="file-row">
                <button class="primary" id="startButton" disabled>
                    仮想PCを起動
                </button>
                <button id="stopButton" disabled>
                    停止
                </button>
            </div>

            <div id="status" role="status" aria-live="polite">
                ISOファイルを選択してください。
            </div>
        </div>
    </section>

    <section class="panel" id="vmPanel">
        <div class="vm-toolbar">
            <h1>仮想PC</h1>
            <div class="file-row">
                <button id="sidebarToggle">設定を折りたたむ</button>
                <button id="fullscreenButton">全画面表示</button>
            </div>
        </div>

        <div id="screenFrame">
            <div id="screen">
                <div class="placeholder">
                    <strong>BootBox</strong><br>
                    仮想PCの画面はここに表示されます。<br>
                    左側の設定からISOを選択して起動してください。
                </div>
            </div>
        </div>
    </section>

</main>

<footer>BootBox Alpha</footer>

<script src="./lib/libv86.js"></script>

<script>
"use strict";

const isoInput = document.getElementById("isoFile");
const hddInput = document.getElementById("hddFile");
const hddSizeInput = document.getElementById("hddSize");

const isoName = document.getElementById("isoName");
const hddName = document.getElementById("hddName");

const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");
const statusElement = document.getElementById("status");
const screenElement = document.getElementById("screen");
const screenFrame = document.getElementById("screenFrame");

const fullscreenButton = document.getElementById("fullscreenButton");
const sidebarToggle = document.getElementById("sidebarToggle");

let selectedISO = null;
let selectedHDD = null;
let emulator = null;
let starting = false;

function setStatus(message) {
    statusElement.textContent = message;
}

function updateButtons() {
    startButton.disabled = !selectedISO || starting || !!emulator;
    stopButton.disabled = !emulator;

    isoInput.disabled = starting || !!emulator;
    hddInput.disabled = starting || !!emulator;
    hddSizeInput.disabled = starting || !!emulator;
}

function showPlaceholder(message) {
    screenElement.replaceChildren();

    const placeholder = document.createElement("div");
    placeholder.className = "placeholder";
    placeholder.textContent = message;

    screenElement.appendChild(placeholder);
}

function formatBytes(bytes) {
    if (bytes >= 1024 ** 3) {
        return (bytes / 1024 ** 3).toFixed(2) + " GB";
    }

    return (bytes / 1024 ** 2).toFixed(1) + " MB";
}

isoInput.addEventListener("change", () => {
    selectedISO = isoInput.files?.[0] || null;

    if (selectedISO) {
        isoName.textContent =
            selectedISO.name + "（" + formatBytes(selectedISO.size) + "）";
        setStatus("ISOを選択しました。");
    } else {
        isoName.textContent = "ISO未選択";
    }

    updateButtons();
});

hddInput.addEventListener("change", () => {
    selectedHDD = hddInput.files?.[0] || null;

    if (selectedHDD) {
        hddName.textContent =
            selectedHDD.name + "（" + formatBytes(selectedHDD.size) + "）";

        setStatus(
            "HDDイメージを選択しました。\n" +
            "実際の容量は選択したファイルのサイズで決まります。"
        );
    } else {
        hddName.textContent = "HDD未選択";
    }

    updateButtons();
});

startButton.addEventListener("click", async () => {
    if (!selectedISO || starting || emulator) return;

    if (typeof window.V86 !== "function") {
        setStatus(
            "v86を読み込めません。\n" +
            "./lib/libv86.js の配置を確認してください。"
        );
        return;
    }

    const requestedMB = Number(hddSizeInput.value);

    if (!selectedHDD && requestedMB > 2048) {
        const proceed = confirm(
            "選択したHDD容量は " + (requestedMB / 1024) + " GB です。\n\n" +
            "同じ容量のメモリ領域を確保するため、ブラウザが停止したり、" +
            "起動に失敗したりする可能性があります。\n\n" +
            "続行しますか？"
        );

        if (!proceed) return;
    }

    starting = true;
    updateButtons();
    setStatus("ISOを読み込んでいます……");

    try {
        const isoBuffer = await selectedISO.arrayBuffer();

        if (!isoBuffer.byteLength) {
            throw new Error("ISOファイルが空です。");
        }

        const options = {
            wasm_path: "./build/v86.wasm",
            memory_size: 512 * 1024 * 1024,
            vga_memory_size: 8 * 1024 * 1024,
            screen_container: screenElement,
            bios: {
                url: "./bios/seabios.bin"
            },
            vga_bios: {
                url: "./bios/vgabios.bin"
            },
            cdrom: {
                buffer: isoBuffer
            },
            autostart: true
        };

        if (selectedHDD) {
            setStatus("HDDイメージを読み込んでいます……");

            options.hda = {
                buffer: await selectedHDD.arrayBuffer()
            };
        } else {
            setStatus(
                "空の仮想HDD（" + requestedMB + " MB）を作成しています……"
            );

            options.hda = {
                buffer: new ArrayBuffer(requestedMB * 1024 * 1024)
            };
        }

        screenElement.replaceChildren();

        emulator = new V86(options);

        emulator.add_listener("emulator-ready", () => {
            starting = false;
            updateButtons();
            setStatus("仮想PCの準備ができました。OSの起動を待っています。");
        });

        emulator.add_listener("emulator-started", () => {
            setStatus("仮想PCが起動しています。");
        });

        emulator.add_listener("emulator-stopped", () => {
            setStatus("仮想PCが停止しました。");
        });

        emulator.add_listener("download-progress", (data) => {
            if (
                data &&
                Number.isFinite(data.loaded) &&
                Number.isFinite(data.total) &&
                data.total > 0
            ) {
                const percent = Math.round(data.loaded / data.total * 100);
                setStatus("仮想PCの準備中…… " + percent + "%");
            }
        });

        updateButtons();

    } catch (error) {
        console.error("[BootBox]", error);

        try {
            emulator?.stop();
        } catch (_) {}

        emulator = null;
        starting = false;

        showPlaceholder("仮想PCを起動できませんでした。");
        updateButtons();

        setStatus(
            "起動に失敗しました。\n" +
            (error?.message || String(error)) +
            "\nISO・HDDイメージ・v86関連ファイルを確認してください。"
        );
    }
});

stopButton.addEventListener("click", () => {
    if (!emulator) return;

    try {
        emulator.stop();
    } catch (error) {
        console.error("[BootBox] 停止エラー", error);
    }

    emulator = null;
    starting = false;

    showPlaceholder("仮想PCは停止しています。");
    updateButtons();

    setStatus(
        "仮想PCを停止しました。\n" +
        "HDDの変更内容は自動保存されません。"
    );
});

fullscreenButton.addEventListener("click", async () => {
    try {
        if (!document.fullscreenElement) {
            await screenFrame.requestFullscreen();
            document.body.classList.add("fullscreen-mode");
            fullscreenButton.textContent = "全画面表示を終了";
        } else {
            await document.exitFullscreen();
        }
    } catch (error) {
        setStatus(
            "全画面表示を開始できませんでした。\n" +
            (error?.message || String(error))
        );
    }
});

document.addEventListener("fullscreenchange", () => {
    const active = !!document.fullscreenElement;

    document.body.classList.toggle("fullscreen-mode", active);
    fullscreenButton.textContent =
        active ? "全画面表示を終了" : "全画面表示";
});

sidebarToggle.addEventListener("click", () => {
    document.body.classList.toggle("sidebar-collapsed");

    sidebarToggle.textContent =
        document.body.classList.contains("sidebar-collapsed")
            ? "設定を展開"
            : "設定を折りたたむ";
});

document.addEventListener("keydown", (event) => {
    if (event.key === "F11") {
        event.preventDefault();
        fullscreenButton.click();
    }
});
</script>

</body>
</html>
